{% extends "base.html" %}

{% block title %}Payment - E-Shop{% endblock %}

{% block content %}

<h1>Select Payment Method</h1>

<p>Product: {{ product['name'] }}</p>

<p>Quantity: {{ quantity }}</p>

<p>Amount: ₹{{ total_amount }}</p>

<form action="{{ url_for('create_cod_order', product_id=product_id) }}" method="POST">

    <button type="submit">Cash on Delivery</button>

</form>

<form action="{{ url_for('create_razorpay_order', product_id=product_id) }}" method="POST">

    <input type="hidden" name="payment_method" value="UPI">

    <button type="submit">Pay with UPI</button>

</form>

<form action="{{ url_for('create_razorpay_order', product_id=product_id) }}" method="POST">

    <input type="hidden" name="payment_method" value="CARD">

    <button type="submit">Pay with Card</button>

</form>

{% endblock %}
