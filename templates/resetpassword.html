{% extends "base.html" %}
{% block title %}Reset password | Eshop{% endblock %}
{% block content %}
<section class="auth-panel narrow">
	<p class="eyebrow">Account recovery</p><h1>Choose a new password.</h1>
	{% if otp %}<div class="dev-code">Local development code: <strong>{{ otp }}</strong></div>{% endif %}
	<form method="post">
		<label>OTP <input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
		<label>New password <input type="password" name="password" minlength="8" required></label>
		<label>Confirm password <input type="password" name="cpassword" minlength="8" required></label>
		<button type="submit">Update password</button>
	</form>
</section>
{% endblock %}
