{% extends "base.html" %}
{% block title %}Forgot password | Eshop{% endblock %}
{% block content %}
<section class="auth-panel narrow">
	<p class="eyebrow">Account recovery</p><h1>Reset your password.</h1>
	<p class="muted">We will generate a verification code for your account.</p>
	<form method="post">
		<label>Email / Phone no <input name="identity" required></label>
		<button type="submit">Send reset code</button>
	</form>
	<p class="switch"><a href="{{ url_for('login') }}">Back to login</a></p>
</section>
{% endblock %}
