<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-Shop{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="{{ url_for('dashboard') }}" class="logo">E-Shop</a>

        <div class="nav-links">
            {% if session.get('user_id') %}
                <a href="{{ url_for('cart') }}">My Carts</a>
                <a href="{{ url_for('myfav') }}">My Favs</a>
                <a href="{{ url_for('myorders') }}">My Orders</a>
                <a href="{{ url_for('profile') }}">Profile</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}">Login</a>
                <a href="{{ url_for('register') }}">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="main-content">
    {% block content %}
    {% endblock %}
</main>

<footer class="footer">
    <p>© 2026 E-Shop. All Rights Reserved.</p>
</footer>

</body>
</html>
